# ng-runner-policy: hosted-first-v1
name: docker

# Tests gate the image. A published `latest` that fails its own suite is worse
# than no published image, because somebody else is now running it.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep main builds independent so a newer push cannot cancel an earlier
# candidate. Release tags share a queue so stable aliases stay in release order.
concurrency:
  group: docker-${{ startsWith(github.ref, 'refs/tags/v') && 'stable-releases' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  release-notes:
    name: Release-note contract
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot')
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate stable image tag policy
        run: python scripts/check_image_alias_policy.py

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          python scripts/release_notes.py check \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          python scripts/release_notes.py check-changelog-tags

  test:
    # Pull requests stay hosted; trusted main validation uses the isolated shared pool.
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest PyYAML

      - name: Run pytest suite
        run: python -m pytest tests/ -q

  acquisition-proof:
    name: Packaged acquisition (${{ matrix.dockerfile }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native test image
        run: docker build --build-arg TARGETARCH=amd64 -f "${{ matrix.dockerfile }}" -t romarrng:acquisition-proof .
      - name: Prove sandboxed acquisition and SeerrNG delivery
        run: >-
          docker run --rm -e PYTHONPATH=/app --entrypoint python
          -v "$PWD/scripts:/proof:ro" romarrng:acquisition-proof
          /proof/prove_upstream_acquisition.py

  image:
    needs: [test, release-notes, acquisition-proof]
    if: always() && needs.test.result == 'success' && needs.acquisition-proof.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    env:
      BUILDKIT_EGRESS_PROXY: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && 'http://10.0.2.100:3128' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate stable image tag policy
        run: python scripts/check_image_alias_policy.py

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' romarr/app.py | head -n 1)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match ROMarr.VERSION $version."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag $TAG is not on main."
            exit 1
          }
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ "$TAG" != "$latest_tag" ]]; then
            echo "Release tag $TAG is older than the latest version tag $latest_tag."
            exit 1
          fi

      # armv7 has no musl wheel for charset-normalizer, so that leg compiles
      # under emulation. It is the slow one; the others are native-speed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The isolated BuildKit daemon needs the runner's trust roots too.
          buildkitd-config-inline: |
            [registry."docker.io"]
              ca = ["/etc/ssl/certs/ca-certificates.crt"]
          driver-opts: |
            env.HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.SSL_CERT_FILE=/etc/buildkit/certs/docker.io/ca-certificates.crt

      # The suite gates the code; nothing gated the image. A broken entrypoint,
      # a dependency that failed to install, or a missing bsdtar would all pass
      # every test and publish anyway -- and the first person to find out would
      # be somebody who pulled it. So one leg is built, booted and questioned
      # before anything is pushed. The multi-arch build below reuses this
      # build's cache, so the cost is close to nothing.
      - name: Build the amd64 leg for a smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: romarr:smoke
          build-args: |
            HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            NO_PROXY=localhost,127.0.0.1
            no_proxy=localhost,127.0.0.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Boot the image and ask it whether it is alive
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/romarr-config" "$RUNNER_TEMP/romarr-roms" \
                   "$RUNNER_TEMP/romarr-downloads"
          printf 'download fixture' > "$RUNNER_TEMP/romarr-downloads/source.rar"
          chmod 0775 "$RUNNER_TEMP/romarr-downloads/source.rar"
          before=$(stat -c '%u:%g:%a' "$RUNNER_TEMP/romarr-downloads/source.rar")
          docker run -d --name smoke -p 6868:6868 \
            --read-only --cap-drop ALL --cap-add CHOWN --cap-add SETGID \
            --cap-add SETUID --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            -e PUID=1000 -e PGID=1000 -e UMASK=002 \
            -v "$RUNNER_TEMP/romarr-config:/config" \
            -v "$RUNNER_TEMP/romarr-roms:/roms" \
            -v "$RUNNER_TEMP/romarr-downloads:/downloads" \
            romarr:smoke
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:6868/api/health && break
            sleep 2
          done

          echo "--- liveness ---"
          curl -fsS http://127.0.0.1:6868/api/health

          # No credential is set anywhere in this job, deliberately. An open
          # install is the failure mode that matters most for an image people
          # put on their LAN, and it is checkable without one.
          echo "--- the gate is on ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 http://127.0.0.1:6868/api/v1/system/status)
          test "$code" = "401" || { echo "status answered $code, not 401"; exit 1; }

          # bsdtar is not optional: without it every disc-platform import fails
          # on a format it cannot open, and nothing else in this job would
          # notice its absence.
          echo "--- the pieces that are easy to lose ---"
          docker exec smoke sh -c 'command -v bsdtar >/dev/null' \
            || { echo "bsdtar missing"; exit 1; }
          docker exec smoke sh -c 'command -v git >/dev/null' \
            || { echo "git missing; catalogue plugins cannot install"; exit 1; }
          docker exec smoke python -c "import requests, rom_hub; from rom_hub.sandbox import install; install()" \
            || { echo "a dependency did not install"; exit 1; }
          docker exec smoke python -c "from pathlib import Path; from rom_hub.catalog_sources import load_all; c=load_all(Path('/tmp/hub-smoke')); print(f'{len(c.entries)} bundled plugins'); assert c.entries" \
            || { echo "ROM Hub installed without its plugin catalogue"; exit 1; }
          docker exec smoke sh -c 'ROM_HUB_HOME=/tmp/hub-install rom-hub plugin install archive-org' \
            || { echo "bundled Archive.org plugin did not install"; exit 1; }

          echo "--- privileges were dropped ---"
          docker logs smoke 2>&1 | grep -q "starting as 1000:1000 with umask 002" \
            || { echo "entrypoint did not drop to PUID:PGID"; exit 1; }

          echo "--- mounted downloads were not rewritten ---"
          after=$(stat -c '%u:%g:%a' "$RUNNER_TEMP/romarr-downloads/source.rar")
          test "$after" = "$before" \
            || { echo "source permissions changed: $before -> $after"; exit 1; }
          test "$(awk '/^Umask:/ {print $2}' /proc/$(docker inspect -f '{{.State.Pid}}' smoke)/status)" = "0002" \
            || { echo "server process did not inherit UMASK=002"; exit 1; }

          docker rm -f smoke

      - name: Build all supported platforms without publishing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          build-args: |
            HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            NO_PROXY=localhost,127.0.0.1
            no_proxy=localhost,127.0.0.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  image_publish:
    needs: [image]
    if: always() && needs.image.result == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve this fork's image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=ROMarrNG
            org.opencontainers.image.description=ROMarrNG adds a SeerrNG request and library contract to ROMarr
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=main,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=master,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/romarrng-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/romarrng-image.spdx.json
          push-to-registry: true

  # Debian variant for the optional Playwright download client. Its aliases
  # follow the same release tag while remaining separate from the Alpine image.
  image-browser:
    name: Browser image validation
    needs: [image, release-notes]
    if: always() && needs.image.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && github.event_name == 'pull_request'
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build browser image for all supported platforms without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: false
          tags: romarrng:browser-validation
          cache-from: type=gha,scope=browser
          cache-to: type=gha,scope=browser,mode=max
          provenance: false

  image_browser_publish:
    needs: [image, release-notes]
    if: always() && github.event_name != 'pull_request' && needs.image.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve this fork's image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=ROMarrNG (browser edition)
            org.opencontainers.image.description=ROMarrNG on Debian with the Playwright client for the Headless Browser download client
          tags: |
            type=raw,value=browser,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=main-browser,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=master-browser,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest-browser,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=stable-browser,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}}-browser
            type=semver,pattern={{major}}.{{minor}}-browser
            type=sha,format=short,suffix=-browser

      - name: Build and push browser edition
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,scope=browser,mode=max
          provenance: false

      - name: Generate browser image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/romarrng-browser-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest browser image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest browser image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/romarrng-browser-image.spdx.json
          push-to-registry: true

  verify-stable-image-tags:
    name: Verify stable image aliases
    needs: [image_publish, image_browser_publish]
    if: always() && github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || (needs.image_publish.result == 'success' && needs.image_browser_publish.result == 'success'))
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify all aliases match the latest stable release image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python scripts/check_stable_image_tags.py --version "${GITHUB_REF_NAME#v}"
          else
            python scripts/check_stable_image_tags.py
          fi

  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.image_publish.result == 'success' && needs.image_browser_publish.result == 'success' && needs.verify-stable-image-tags.result == 'success'
    needs: [image_publish, image_browser_publish, verify-stable-image-tags]
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changelog tag coverage
        run: python scripts/release_notes.py check-changelog-tags

      - name: Extract changelog entry
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/romarrng
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { copying = 1; found = 1; print; next }
            copying && /^## \[/ { exit }
            copying { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^")"
          python scripts/release_notes.py assemble \
            --previous-tag "$previous_tag" \
            --head "$GITHUB_SHA" \
            --changelog release-notes.md \
            --output release-notes.md \
            --require-prepared-changelog
          {
            echo ""
            echo "**Container image**: \`${IMAGE}:${VERSION}\`"
            echo "- Browser edition: \`${IMAGE}:${VERSION}-browser\` (AMD64/ARM64; Playwright client only)"
            echo "- [GitHub Container Registry](https://github.com/${{ github.repository }}/pkgs/container/romarrng)"
            echo ""
            echo "Pull with: \`docker pull ${IMAGE}:${VERSION}\`."
          } >> release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ROMarrNG ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false

      - name: Announce release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/romarrng
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to complete a release.' >&2
            exit 1
          }
          version="${TAG#v}"
          image_ref="${IMAGE}:${version}"
          python scripts/release_notes.py split-discord --input release-notes.md > chunks.json
          chunk_count="$(jq 'length' chunks.json)"
          (( chunk_count > 0 )) || {
            echo 'The generated release notes are empty.' >&2
            exit 1
          }

          webhook_url="$DISCORD_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index++)); do
            description="$(jq -r --argjson index "$index" '.[$index]' chunks.json)"
            number=$((index + 1))
            title="ROMarrNG ${TAG} release notes (${number}/${chunk_count})"
            jq -n \
              --arg username "ROMarrNG Releases" \
              --arg title "$title" \
              --arg url "$RELEASE_URL" \
              --arg description "$description" \
              --arg image "$image_ref" \
              --arg workflow "$WORKFLOW_URL" \
              --argjson first "$index" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  fields: (if $first == 0 then [
                    { name: "Image", value: $image, inline: false },
                    { name: "Workflow", value: $workflow, inline: false }
                  ] else [] end)
                }]
              }' > payload.json

            response="$(curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -X POST \
              --data @payload.json \
              "$webhook_url")"
            jq -e --arg description "$description" \
              '.id != null and .embeds[0].description == $description' \
              <<< "$response" > /dev/null
            if (( number < chunk_count )); then
              sleep 1
            fi
          done
