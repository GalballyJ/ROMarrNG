name: ROMarrNG offline runner-policy checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Runner sandbox policy checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/ROMarrNG' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name && github.event.pull_request.base.repo.full_name == 'snapetech-org/ROMarrNG' && github.event.pull_request.base.ref == 'main' && fromJSON('["self-hosted", "linux", "x64", "public-pr-romarrng"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check Python validation engine syntax
        run: python3 -m compileall -q scripts/validation_engine
      - name: Test trusted runner launcher boundaries
        run: node --test scripts/validation_engine/trusted-test-launcher.contract.mjs
